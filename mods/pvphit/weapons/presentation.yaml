# Audio overrides only. FCInduction and FCVehicleDeath already opt into visibility gating.
FCScoutGun:
	Report: pvphit|audio/presentation/scout-fire-1.wav, pvphit|audio/presentation/scout-fire-2.wav, pvphit|audio/presentation/scout-fire-3.wav
	Warhead@effect: CreateEffect
		ImpactSounds: pvphit|audio/presentation/scout-impact-1.wav, pvphit|audio/presentation/scout-impact-2.wav, pvphit|audio/presentation/scout-impact-3.wav

FCMortar:
