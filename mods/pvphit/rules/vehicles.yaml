# Support vehicle artwork and timing-neutral working animations.
FC.HAULER:
	Buildable:
		IconPalette: furnace-player
		IconPaletteIsPlayerPalette: true
	WithMoveAnimation:
		ValidMovementTypes: Horizontal, Turn
	WithHarvestAnimation:
		HarvestSequence: harvest
	WithDockingAnimation:
		DockSequence: idle
		DockLoopSequence: unload
