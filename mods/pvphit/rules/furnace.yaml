# Original actors are additive. Build menus are enabled only by the slice maps.
World:
	# The lobby reads factions from default rules, before loading map overrides.
	Faction@kiln:
		Name: faction-kiln.name
		InternalName: kiln
		Side: Allies
		Description: faction-kiln.description
		Selectable: false

^Palettes:
	PlayerColorPalette@FURNACE:
		BaseName: furnace-player
		BasePalette: player
	PlayerColorShift@FURNACE:
		BasePalette: furnace-player
		MinHue: 0.27
		MaxHue: 0.42
		ReferenceHue: 0.34
		ReferenceSaturation: 0.75
		ReferenceValue: 0.6

FC.TANK:
	Inherits: ^TrackedVehicle
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	-ClassicFacingBodyOrientation:
	BodyOrientation:
		CameraPitch: 120
	-MustBeDestroyed:
	-Capturable:
	-WithDamageOverlay:
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 30
		Prerequisites: ~fc.vehicles
		Description: actor-fc-tank.description
	Valued:
		Cost: 1000
	Tooltip:
		Name: actor-fc-tank.name
		GenericName: actor-fc-tank.name
	Health:
		HP: 46000
	Armor:
		Type: Heavy
	Mobile:
		Speed: 72
		TurnSpeed: 20
	RevealsShroud:
		Range: 6c0
	Turreted:
		TurnSpeed: 20
	Armament:
		Weapon: FCInduction
		Recoil: 100
		RecoilRecovery: 20
		LocalOffset: 1100,0,550
		MuzzleSequence: muzzle
	AttackTurreted:
	WithMuzzleOverlay:
	WithSpriteTurret:
	WithShadow:
		Offset: 85,128,0
		ZOffset: -1024
	Selectable:
		Bounds: 1536, 1365, 0, -256
		DecorationBounds: 1706, 1536, 0, -256
	RenderSprites:
		Image: fc-tank
		PlayerPalette: furnace-player
	SpawnActorOnDeath:
		Actor: fc.tank.husk
	FireWarheadsOnDeath:
		Weapon: FCVehicleDeath
		EmptyWeapon: FCVehicleDeath
	Voiced:
		VoiceSet: FurnaceVehicle

FC.SCOUT:
	Inherits: FC.TANK
	Buildable:
		BuildPaletteOrder: 20
		Description: actor-fc-scout.description
	Valued:
		Cost: 450
	Tooltip:
		Name: actor-fc-scout.name
		GenericName: actor-fc-scout.name
	Health:
		HP: 15333
	Armor:
		Type: Light
	Mobile:
		Speed: 125
		Locomotor: wheeled
	RevealsShroud:
		Range: 8c0
	Armament:
		Weapon: FCScoutGun
		LocalOffset: 460,0,450
		Recoil: 35
	Captures:
		CaptureTypes: furnace-facility
		CaptureDelay: 125
		ConsumedByCapture: false
		SabotageThreshold: 0
	RenderSprites:
		Image: fc-scout
	SpawnActorOnDeath:
		Actor: fc.scout.husk
	Selectable:
		Bounds: 1100,1000,0,-200

FC.HAULER:
	Inherits: ^TrackedVehicle
	Inherits@selection: ^SelectableEconomicUnit
	-ClassicFacingBodyOrientation:
	BodyOrientation:
		CameraPitch: 120
	-MustBeDestroyed:
	-Capturable:
	-WithDamageOverlay:
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 10
		Prerequisites: ~fc.vehicles
		Description: actor-fc-hauler.description
	Valued:
		Cost: 1000
	Tooltip:
		Name: actor-fc-hauler.name
		GenericName: actor-fc-hauler.name
	Health:
		HP: 46000
	Armor:
		Type: Heavy
	Mobile:
		Speed: 72
	RevealsShroud:
		Range: 4c0
	Harvester:
		Resources: Ore
		BaleUnloadDelay: 1
		SearchFromProcRadius: 30
		SearchFromHarvesterRadius: 15
		HarvestFacings: 32
	StoresResources:
		Capacity: 20
		Resources: Ore
	DockClientManager:
	WithHarvestAnimation:
		HarvestSequence: idle
	WithDockingAnimation:
		DockSequence: idle
		DockLoopSequence: idle
	WithStoresResourcesPipsDecoration:
		Position: BottomLeft
		Margin: 4,3
		RequiresSelection: true
		PipCount: 5
		ResourceSequences:
			Ore: pip-yellow
	RenderSprites:
		Image: fc-hauler
		PlayerPalette: furnace-player
	WithShadow:
		Offset: 85,128,0
		ZOffset: -1024
	SpawnActorOnDeath:
		Actor: fc.hauler.husk
	FireWarheadsOnDeath:
		Weapon: FCVehicleDeath
		EmptyWeapon: FCVehicleDeath
	Voiced:
		VoiceSet: FurnaceVehicle

FC.SIEGE:
	Inherits: FC.TANK
	Buildable:
		BuildPaletteOrder: 40
		Description: actor-fc-siege.description
	Valued:
		Cost: 1400
	Tooltip:
		Name: actor-fc-siege.name
		GenericName: actor-fc-siege.name
	Health:
		HP: 34500
	Mobile:
		Speed: 55
		PauseOnCondition: !mobile || being-captured
	-Turreted:
	-WithSpriteTurret:
	-AttackTurreted:
	AttackOmni:
		RequiresCondition: braced
	Armament:
		Weapon: FCMortar
		LocalOffset: 0,0,900
		RequiresCondition: braced
		Recoil: 0
	GrantConditionOnDeploy:
		DeployedCondition: braced
		UndeployedCondition: mobile
		UndeployOnMove: true
		DeploySounds: pvphit|audio/mechanism.wav
		UndeploySounds: pvphit|audio/mechanism.wav
	WithFacingSpriteBody:
		RequiresCondition: !braced
	WithFacingSpriteBody@BRACED:
		Name: braced
		Sequence: deployed
		RequiresCondition: braced
	WithMakeAnimation:
		BodyNames: body, braced
		# Deployment has its own completion callbacks and mobile/braced conditions.
		# A creation-time condition can leak before either conditional body enables.
	RenderSprites:
		Image: fc-siege
	SpawnActorOnDeath:
		Actor: fc.siege.husk

