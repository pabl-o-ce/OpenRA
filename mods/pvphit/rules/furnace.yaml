	Targetable:
		TargetTypes: GroundActor, Husk, NoAutoTarget
	ChangesHealth:
		Step: -1000
		StartIfBelow: 101
		Delay: 25
	RenderSprites:
		Image: fc-tank-wreck
	WithShadow:
