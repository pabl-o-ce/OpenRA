# Environment-only actors. No cover, projectile blocking or resource behavior.

^FCENVPROP:
	Inherits: ^SpriteActor
	Immobile:
		OccupiesSpace: false
	WithSpriteBody:
	HiddenUnderShroud:
		Type: CenterPosition
	RenderSprites:
		Palette: player
	MapEditorData:
		Categories: Decoration

FC.ENV.WALL-A:
	Inherits: ^FCENVPROP
	Immobile:
		OccupiesSpace: true
	RenderSprites:
		Image: fc-env-wall-a

